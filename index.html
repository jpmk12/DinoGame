<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a3d2e" />
<title>DinoGrow</title>
<link rel="stylesheet" href="style.css" />
<link rel="apple-touch-icon" href="icon.svg" />
<!-- Polyfill: makes import maps + bare specifiers work on older iOS Safari (<16.4) -->
<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="stage-label">Hatchling</div>
    <div id="growth-bar"><div id="growth-fill"></div></div>
    <div id="score">Score: 0</div>
  </div>

  <div id="touch-controls" class="hidden">
    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>
    <button id="chomp-btn">CHOMP</button>
  </div>

  <div id="title-screen">
    <h1>DinoGrow</h1>
    <p class="subtitle">Eat. Grow. Become a giant!</p>
    <p class="prompt">Pick your dinosaur:</p>
    <div id="picker"><!-- populated by main.js --></div>
  </div>

  <div id="stage-up" class="hidden">
    <div id="stage-up-text">Stage Up!</div>
    <div id="stage-up-name">Juvenile</div>
  </div>

  <div id="game-over" class="hidden">
    <h2>You got eaten!</h2>
    <p>Don't worry, you respawn.</p>
    <button id="respawn-btn">Try again</button>
  </div>

  <div id="error-banner" class="hidden">
    <strong>Error</strong>
    <pre id="error-text"></pre>
  </div>

  <script>
    // Catch errors before the module even runs so they're visible on-screen
    // (no devtools on a phone). Visible during startup; gameplay errors logged too.
    (function () {
      const show = (msg) => {
        const b = document.getElementById('error-banner');
        const t = document.getElementById('error-text');
        if (b && t) {
          t.textContent = msg;
          b.classList.remove('hidden');
        }
      };
      window.addEventListener('error', (e) => {
        show((e.message || 'Unknown error') + '\n' + (e.filename || '') +
             (e.lineno ? ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', (e) => {
        show('Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    })();
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
